id: aerosol-incubate-closed
title: 孵育时容器宜关闭（弱依据）
conclusion: >-
  盛有生物材料的容器在孵育或静置时宜保持关闭。已核对资料没有直接写“孵育必须关盖”：
  BMBL 把“开启容器”列为可能产生感染性气溶胶的操作，本卡把它推广到孵育期间保持关闭。
