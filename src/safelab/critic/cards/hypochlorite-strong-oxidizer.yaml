id: hypochlorite-strong-oxidizer
title: 次氯酸钠属强氧化剂
conclusion: >-
  次氯酸钠溶液的反应性分组是强氧化剂、碱性盐、水和水溶液；受热或与酸接触会放出含氯有毒烟气，
  与硫酸反应放热并放出氯气。物质族表把次氯酸盐归为强氧化剂即依据于此。
