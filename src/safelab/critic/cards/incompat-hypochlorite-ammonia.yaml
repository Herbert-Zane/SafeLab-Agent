id: incompat-hypochlorite-ammonia
title: 漂白剂与氨、含氨化合物不得混合
conclusion: >-
  次氯酸盐不得与氨、含氨（铵）化合物或胺类混合，反向操作同样禁止；次氯酸盐与胺接触会生成氯胺。
scope:
  families: [hypochlorite, ammonia]
  actions: [dispense, pour]
