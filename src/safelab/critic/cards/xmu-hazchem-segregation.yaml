id: xmu-hazchem-segregation
title: 厦门大学危险化学品分类存放与危废处置
conclusion: >-
  厦门大学规定危险化学品按化学试剂性质分类规范存放，化学实验危废委托有资质单位清运处置。
  该规定没有具体的“不相容化学品不得混合”条文，只能引用到分类存放和危废处置的原则。
