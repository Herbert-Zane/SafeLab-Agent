id: mixing-vortex-not-pipetting
title: 用关闭容器涡旋混匀，不用反复吹打
conclusion: >-
  混匀含生物材料的液体时，用涡旋混合器而不是倒置混匀；移液时沿管壁排液，不用反复吸打来混匀。
