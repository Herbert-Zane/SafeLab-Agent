id: pipetting-aerosol-technique
title: 移液手法上减少气溶胶和内部污染
conclusion: >-
  枪头浸在液体中时不要按下活塞；不要猛吸或猛松活塞，否则会污染移液器内部或滤芯造成交叉污染；
  不要用力排液或用力弹出枪头；带着用过的枪头时不要把移液器倒置。
