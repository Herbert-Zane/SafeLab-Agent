id: aerosol-mixing-closed
title: 含生物材料的容器关闭后才能涡旋
conclusion: >-
  对含生物材料的液体施加能量（涡旋、振荡、混合）会产生气溶胶。混合操作应在密封容器中进行，
  BSL-2 实验室还要求在生物安全柜或其他物理防护中进行。本平台能观测到的物理防护只有容器是否关闭，
  因此容器未关闭时不得涡旋。本卡只针对涡旋、振荡、混合这类对液体施加机械能量的操作和设备；
  高压灭菌器等其他仪器不在本卡范围内，已核对资料也没有覆盖它们。
scope:
  families: [biological]
  actions: [vortex, instrument_start]
predicate:
  kind: open_agitation
  families_any: [biological]
  actions: [vortex]
  device_keywords: [vortex, shak, mix]
rules: [R2]
evidence:
  grade: A
  note: >-
    大学生物安全 SOP 直接要求混合操作使用带 O 形圈螺旋盖的密封容器（B4）；BMBL 把涡旋混合器列为
    气溶胶来源（B2 p.16），但对 BSL-2 的原文要求是“生物安全柜或其他物理防护”（B2 p.41），
    关盖只是本平台可用的一种物理防护，不是 BMBL 的硬性条文。
enforcement: hard
sources:
  - {id: B4, at: "p.1，Mixing Operations 第 1-3 条"}
  - {id: B2, at: "p.16，Aerosols and droplets"}
  - {id: B2, at: "p.41，Section IV BSL-2，B. Special Practices 第 4 条"}
