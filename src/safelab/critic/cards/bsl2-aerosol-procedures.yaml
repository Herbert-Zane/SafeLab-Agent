id: bsl2-aerosol-procedures
title: BSL-2 产生气溶胶的操作需物理防护
conclusion: >-
  在 BSL-2，可能产生感染性气溶胶或飞溅的操作（移液、离心、研磨、匀浆、振荡、混合、超声、开启容器）
  应尽可能在生物安全柜或其他物理防护装置中进行。
