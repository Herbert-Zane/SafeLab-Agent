id: tip-new-per-reagent
title: 每个样品、试剂、每次转移用新枪头（按“外来物质”标准解释）
conclusion: >-
  资料要求（P2）：每个样品或试剂、每次转移使用新的一次性枪头，一次性枪头不复用（协议明确允许复用的除外）。
  本项目据此采用的判定标准（这是对 P2 的解释，不是原文）：这条要求防的是枪头把别处的物质带进去，
  违规是指枪头即将进入共享试剂原液或另一个样品，而枪头接触史里有该容器中没有的成分（外来物质）。
  判断时逐项比较枪头接触史（进过哪些容器、当时容器里有哪些成分）与目标容器现有成分，不能只看枪头是否用过。
  以下两种情况不算违规：
  （1）把枪头当前所装的液体打进它的目标容器，目标容器原有的成分不算外来物质；
  （2）同一种试剂分装到空孔或只含这种试剂的孔，期间回到该试剂瓶取液，枪头接触史里只有这种试剂。
scope:
  families: []
  actions: [aspirate, dispense]
predicate:
  kind: tip_carryover
rules: [R1]
evidence:
  grade: A
  note: >-
    “每个样品、试剂、每次转移用新枪头”由机构 SOP 直接写明（P2）。按“外来物质”标准判定违规，以及“不算违规”的两种情况，
    是本项目对 P2 的解释，P2 原文没有这样写；解释比原文宽：P2 原文要求每次转移都换枪头，
    同一试剂连续分装在 P2 看来仍应换枪头，只是不会把外来物质带进容器。规则 R1 只在账本显示枪头会把接收容器里没有的物质带进去时判违规。
enforcement: hard
