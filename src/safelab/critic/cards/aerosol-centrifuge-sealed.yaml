id: aerosol-centrifuge-sealed
title: 离心生物材料须用密封管和安全杯
conclusion: >-
  离心含生物材料的样品时使用不易碎、带 O 形圈螺旋盖的管和密封安全杯或密封转子；
  离心结束后等待气溶胶沉降再开盖。规则只能检查管是否关闭，安全杯是否密封无法观测。
