<text x="766" y="152" font-size="12" font-weight="normal" fill="#444444" text-anchor="end">DeepSeek API</text>
<text x="354" y="177" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">规划器、执行者、审查器 LLM 通道的模型调用</text>
<path d="M 560 198 L 560 240" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)" marker-start="url(#s-ink)"/>
<rect x="40" y="240" width="1040" height="680" rx="8" fill="#e6f0fa" stroke="#1f5fa8" stroke-width="2.4"/>
<text x="58" y="272" font-size="18" font-weight="bold" fill="#174a85" text-anchor="start">SafeLab-Agent（本次参赛新增 · 独立包 · 不拷贝平台代码）</text>
<rect x="60" y="295" width="1000" height="70" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="74" y="321" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">接入与回合编排</text>
<text x="1046" y="321" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">backend.py · bench.py · launch.py</text>
<text x="74" y="346" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">注册 safelab 后端；入口处再做一次防泄漏检查（assert_no_evaluator_state）；每回合向平台返回一个动作</text>
<rect x="60" y="395" width="240" height="365" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="74" y="421" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">记忆</text>
<text x="286" y="421" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">ledger.py · summary.py</text>
<text x="74" y="446" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">执行账本（工作记忆）</text>
<text x="74" y="467" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　容器成分与体积、开闭盖、</text>
<text x="74" y="488" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　枪头状态与接触史、设备</text>
<text x="74" y="509" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">短期窗口</text>
<text x="74" y="530" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　最近 6 步的动作与结果</text>
<text x="74" y="551" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">拒绝清单</text>
<text x="74" y="572" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　平台拒绝与审查器驳回，</text>
<text x="74" y="593" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　连同理由保留整次运行</text>
<text x="74" y="614" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">反思经验库（长期）</text>
<text x="74" y="635" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　只有训练任务写入，</text>
<text x="74" y="656" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　任何运行只读训练条目</text>
<text x="74" y="677" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">安全知识卡片 24 张</text>
<text x="74" y="698" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　来源：公开 SOP / MSDS</text>
<rect x="60" y="790" width="240" height="100" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="74" y="816" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">运行记录</text>
<text x="286" y="816" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">trace.py</text>
<text x="74" y="841" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">每个事件一行：提议、审查、</text>
<text x="74" y="862" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">执行、反思、用量与费用</text>
<rect x="340" y="395" width="440" height="105" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="354" y="421" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">规划器（LLM）</text>
<text x="766" y="421" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">planner.py</text>
<text x="354" y="446" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">把目标拆成阶段：子目标、前置条件、预期观测</text>
<text x="354" y="467" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">按账本逐步检查；偏离时重规划（上限 3 次）</text>
<rect x="340" y="540" width="440" height="105" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="354" y="566" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">执行者（LLM）</text>
<text x="766" y="566" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">actor.py</text>
<text x="354" y="591" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">每回合在当前阶段提出一个原子动作</text>
<text x="354" y="612" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">系统提示词原样采用平台的中性提示，不加安全提示</text>
<rect x="340" y="685" width="440" height="205" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="354" y="711" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">审查器（执行前审查，仅条件 C）</text>
<text x="766" y="711" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">critic/</text>
<rect x="352" y="724" width="134" height="92" rx="6" fill="#e6f0fa" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="419.0" y="747" font-size="15" font-weight="bold" fill="#174a85" text-anchor="middle">规则通道</text>
<text x="419.0" y="772" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">R1–R6</text>
<text x="419.0" y="794" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">依据账本证据</text>
<rect x="494" y="724" width="148" height="92" rx="6" fill="#e6f0fa" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="568.0" y="747" font-size="15" font-weight="bold" fill="#174a85" text-anchor="middle">LLM 通道</text>
<text x="568.0" y="772" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">按风险触发</text>
<text x="568.0" y="794" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">卡片 + 证据核验</text>
<rect x="650" y="724" width="118" height="92" rx="6" fill="#e6f0fa" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="709.0" y="747" font-size="15" font-weight="bold" fill="#174a85" text-anchor="middle">门控</text>
<text x="709.0" y="772" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">硬规则优先</text>
<text x="709.0" y="794" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">改写受限</text>
<path d="M 486 770 L 494 770" fill="none" stroke="#222222" stroke-width="1.4" marker-end="url(#e-ink)"/>
<path d="M 642 770 L 650 770" fill="none" stroke="#222222" stroke-width="1.4" marker-end="url(#e-ink)"/>
<text x="354" y="846" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">结论：放行 / 驳回 / 改写</text>
<text x="354" y="868" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">每条结论带规则号、卡片号和证据路径，可事后核查</text>
<rect x="820" y="395" width="220" height="205" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="834" y="421" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">反思与恢复</text>
<text x="1026" y="421" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">reflexion.py</text>
<text x="834" y="446" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">平台拒绝 → 局部纠正；</text>
<text x="834" y="467" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　同类两次 → 重规划</text>
<text x="834" y="488" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">审查器驳回 → 换动作；</text>
<text x="834" y="509" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">　再驳回 → 重规划 → 终止</text>
<text x="834" y="530" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">预期观测不符 → 重规划</text>
<text x="834" y="551" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">没有独立的反思 LLM</text>
<rect x="820" y="630" width="220" height="130" rx="8" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="834" y="656" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">调用保护</text>
<text x="1026" y="656" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">resilience.py</text>
<text x="834" y="681" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">模型调用超时与退避重试</text>
<text x="834" y="702" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">单次运行费用预算熔断</text>
<text x="834" y="723" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">故障注入（测试用）</text>
