<text x="1530" y="705" font-size="12" font-weight="normal" fill="#222222" text-anchor="start">科学事件</text>
<path d="M 1300 316 L 1062 316" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)"/>
<text x="1180" y="308" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">观测（白名单）+ 上一步反馈</text>
<path d="M 1060 346 L 1298 346" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)"/>
<text x="1180" y="364" font-size="13" font-weight="normal" fill="#222222" text-anchor="middle">每回合一个平台格式动作</text>
<path d="M 1300 805 L 1082 805" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4"/>
<path d="M 1170 793 L 1194 817 M 1194 793 L 1170 817" stroke="#c0392b" stroke-width="3.2" fill="none"/>
<text x="1182" y="783" font-size="13" font-weight="normal" fill="#c0392b" text-anchor="middle">评测结果不回传</text>
<text x="1182" y="838" font-size="12" font-weight="normal" fill="#c0392b" text-anchor="middle">判据、后果模型</text>
<text x="1182" y="856" font-size="12" font-weight="normal" fill="#c0392b" text-anchor="middle">对智能体不可见</text>
<rect x="40" y="960" width="1720" height="104" rx="8" fill="#e6f0fa" stroke="#1f5fa8" stroke-width="2.4"/>
<text x="54" y="986" font-size="16" font-weight="bold" fill="#174a85" text-anchor="start">控制台（本次参赛新增 · 只读日志，不参与决策）</text>
<text x="1746" y="986" font-size="12" font-weight="normal" fill="#174a85" text-anchor="end">console/</text>
<text x="54" y="1011" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">运行列表 · 阶段计划 · 每步时间线（候选动作 → 审查结论 → 实际执行 → 回读变化）· 账本 · Token / 费用 / 时延 · 评测器结果（回合结束后）</text>
<text x="54" y="1032" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">静态查看 / 实时跟踪 / 录像回放；离线干跑没有评测，界面标“未评估”，不冒充仿真结果</text>
<path d="M 180 890 L 180 960" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)"/>
<text x="192" y="946" font-size="12" font-weight="normal" fill="#222222" text-anchor="start">safelab_trace.jsonl</text>
