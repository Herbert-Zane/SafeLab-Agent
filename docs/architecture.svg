<rect width="1800" height="1120" fill="#ffffff"/>
<text x="40" y="58" font-size="28" font-weight="bold" fill="#222222" text-anchor="start">SafeLab-Agent 系统架构</text>
<text x="40" y="88" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">按归属着色：智能体只通过平台的后端注册接口接入，</text>
<text x="40" y="110" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">拿不到评测器的任何状态。</text>
<rect x="1280" y="30" width="480" height="178" rx="8" fill="#ffffff" stroke="#999999" stroke-width="1.0"/>
<text x="1294" y="56" font-size="16" font-weight="bold" fill="#222222" text-anchor="start">图例</text>
<rect x="1296" y="63" width="34" height="20" rx="4" fill="#e6f0fa" stroke="#1f5fa8" stroke-width="1.6"/>
<text x="1342" y="78" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">本次参赛新增：SafeLab-Agent（独立包）</text>
<rect x="1296" y="93" width="34" height="20" rx="4" fill="#fdf0df" stroke="#b0661a" stroke-width="1.6"/>
<text x="1342" y="108" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">平台 BSLBench：既有平台，作为运行环境，不申报</text>
<rect x="1296" y="123" width="34" height="20" rx="4" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.6" stroke-dasharray="6 4"/>
<text x="1342" y="138" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">外部服务</text>
