<path d="M 640 645 L 640 685" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)"/>
<text x="650" y="670" font-size="12" font-weight="normal" fill="#222222" text-anchor="start">候选动作</text>
<path d="M 440 685 L 440 645" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#e-red)"/>
<text x="430" y="670" font-size="12" font-weight="normal" fill="#c0392b" text-anchor="end">驳回 + 理由</text>
<path d="M 820 447 L 780 447" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)"/>
<path d="M 780 852 L 1054 852 L 1054 365" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)"/>
<text x="1046" y="842" font-size="12" font-weight="normal" fill="#222222" text-anchor="end">放行或改写后的动作</text>
<rect x="1280" y="240" width="480" height="680" rx="8" fill="#fdf0df" stroke="#b0661a" stroke-width="2.4"/>
<text x="1298" y="272" font-size="18" font-weight="bold" fill="#8a4d10" text-anchor="start">BSLBench 平台（既有平台 · 运行环境 · 不申报）</text>
<rect x="1300" y="295" width="440" height="125" rx="8" fill="#ffffff" stroke="#b0661a" stroke-width="1.6"/>
<text x="1314" y="321" font-size="16" font-weight="bold" fill="#8a4d10" text-anchor="start">Agent 接口</text>
<text x="1726" y="321" font-size="12" font-weight="normal" fill="#8a4d10" text-anchor="end">src/agent_interface/</text>
<text x="1314" y="346" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">AgentEnvironment；观测白名单（防泄漏）</text>
<text x="1314" y="367" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">系统提示词与动作表、动作解析、计价</text>
<text x="1314" y="388" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">基线后端：条件 A / A′ 不经过 SafeLab</text>
<rect x="1300" y="450" width="440" height="115" rx="8" fill="#ffffff" stroke="#b0661a" stroke-width="1.6"/>
<text x="1314" y="476" font-size="16" font-weight="bold" fill="#8a4d10" text-anchor="start">原子动作执行</text>
<text x="1726" y="476" font-size="12" font-weight="normal" fill="#8a4d10" text-anchor="end">Engine + Isaac Sim</text>
<text x="1314" y="501" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">拿放、开闭盖、装卸枪头、吸液、排液、涡旋、</text>
<text x="1314" y="522" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">孵育、倾倒等，由仿真中的机器人执行；</text>
<text x="1314" y="543" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">返回执行回读，或拒绝并给出原因</text>
<rect x="1300" y="595" width="440" height="85" rx="8" fill="#ffffff" stroke="#b0661a" stroke-width="1.6"/>
<text x="1314" y="621" font-size="16" font-weight="bold" fill="#8a4d10" text-anchor="start">ScientificGraph 科学状态图</text>
<text x="1314" y="646" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">执行观测 → 带证据的科学事件</text>
<rect x="1300" y="720" width="440" height="170" rx="8" fill="#ffffff" stroke="#b0661a" stroke-width="2.4" stroke-dasharray="9 5"/>
<text x="1314" y="746" font-size="16" font-weight="bold" fill="#8a4d10" text-anchor="start">隔离的评测器（智能体与审查器不可见）</text>
<text x="1314" y="771" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">后果模型：不相容混合、交叉污染等</text>
<text x="1314" y="792" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">输出：危险后果 / 完整性失败 / 终态目标</text>
<text x="1314" y="813" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">只在回合结束后产出，不回传智能体</text>
<text x="1314" y="834" font-size="14" font-weight="normal" fill="#222222" text-anchor="start">未覆盖的情形记“未评估”，不当作安全</text>
<path d="M 1520 420 L 1520 450" fill="none" stroke="#222222" stroke-width="1.8" marker-end="url(#e-ink)"/>
